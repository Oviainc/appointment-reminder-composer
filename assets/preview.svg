<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="420" viewBox="0 0 1060 420">
<rect width="1060" height="420" fill="#f6f7fb"/>
<text x="530" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#14213d">The composer and the record, side by side</text>
<g font-family="Arial,sans-serif" font-size="15" fill="#14213d">
<g><rect x="30" y="70" width="490" height="300" rx="14" fill="#ffffff" stroke="#0e9594" stroke-width="2"/><text x="60" y="110" font-weight="700">Reminder composer</text><text x="60" y="145" font-size="13" fill="#667085">Step: 24 hours before</text><text x="60" y="180" font-size="13">Subject: Tomorrow — Consultation at 10:00</text><text x="60" y="210" font-size="13">Hello Client Example,</text><text x="60" y="240" font-size="13">A reminder that your appointment is tomorrow</text><text x="60" y="262" font-size="13">at 10:00. Please reply to confirm you are</text><text x="60" y="284" font-size="13">still coming.</text><text x="60" y="330" font-size="13" fill="#667085">Copy · Email · WhatsApp · Calendar file (.ics)</text></g>
<g><rect x="540" y="70" width="490" height="300" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="570" y="110" font-weight="700">Appointments and history</text><text x="570" y="145" font-size="13" fill="#667085">Next step suggested for every booking</text><text x="570" y="180" font-size="13">Confirmation — logged</text><text x="570" y="210" font-size="13">24-hour reminder — next</text><text x="570" y="240" font-size="13">Outcome: attended / no-show / cancelled</text><text x="570" y="270" font-size="13">Per-client history and no-show rate</text><text x="570" y="330" font-size="13" fill="#667085">EN / FR / ES — written, not machine-translated</text></g>
</g></svg>
